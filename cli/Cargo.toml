[package]
name = "novadiff-cli"
version = "0.1.0"
edition = "2021"
description = "Folder compare + file diff engine for NovaDiff (Electron shell)"

[[bin]]
name = "novadiff-cli"
path = "src/main.rs"

[dependencies]
ignore = "0.4"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
walkdir = "2"
